<div class="catalog-container">
  <h2>Catálogo de Productos</h2>

  <!-- US06: enlace al formulario, visible solo para el Administrador -->
  <a *ngIf="isAdmin" routerLink="/catalog/new"
     style="display: inline-block; margin-bottom: 15px; padding: 8px 16px; background-color: #28a745; color: white; text-decoration: none; border-radius: 4px;">
    + Nuevo producto
  </a>
  
  <div class="filters" style="margin-bottom: 20px;">
    <button *ngFor="let cat of categories" 
            (click)="filterByCategory(cat)"
            [style.fontWeight]="selectedCategory === cat ? 'bold' : 'normal'"
            style="margin-right: 10px; padding: 5px 15px;">
      {{ cat }}
    </button>
  </div>

  <div class="product-grid" style="display: flex; gap: 20px; flex-wrap: wrap;" *ngIf="products.length > 0; else noProducts">
    <div class="product-card" *ngFor="let p of products" style="border: 1px solid #ccc; padding: 15px; width: 200px; text-align: center;">
      <img [src]="p.imageUrl" [alt]="p.name" style="max-width: 100%; height: auto;">
      <h3>{{ p.name }}</h3>
      <p class="price" style="color: green; font-weight: bold;">${{ p.price }}</p>
      <p class="category" style="color: gray; font-size: 12px;">{{ p.category }}</p>
      
      <a [routerLink]="['/catalog', p.id]" style="display: block; margin-top: 10px; text-decoration: none; color: blue;">Ver Detalle</a>
    </div>
  </div>

  <ng-template #noProducts>
    <p>No hay productos disponibles en esta categoría.</p>
  </ng-template>
</div>
